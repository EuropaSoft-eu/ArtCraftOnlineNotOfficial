# Garde le site aligné sur les versions officielles des Craft Apps.
# Toutes les 3 heures : reconstruit le site à partir des dernières versions officielles (c'est la vérification)
# et republie, pour que la page affiche l'heure de la dernière vérification.
# À chaque modification du dépôt ou lancement manuel (onglet Actions, « Run workflow ») : reconstruit aussi.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Construire le site (vérifie les dernières versions officielles)
        run: python build.py --out _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
