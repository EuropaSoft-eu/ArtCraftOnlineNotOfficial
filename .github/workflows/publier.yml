# Garde le site aligné sur les versions officielles des Craft Apps.
# Toutes les 3 heures (et à chaque modification du dépôt ou lancement manuel) : reconstruit et republie,
# pour que la date affichée sur le site soit celle de la dernière vérification.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Construire le site
        run: python build.py --out _site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
